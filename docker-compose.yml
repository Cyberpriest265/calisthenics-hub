# docker-compose.yml
# =============================================
# What is this file?
# Docker Compose lets you define and run multiple
# Docker containers with a single command.
#
# For our local development, we need:
#   1. PostgreSQL database
#   2. (Later) Redis for caching
#
# Command to start: docker compose up -d
# Command to stop:  docker compose down
# =============================================

services:
  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine        # Use PostgreSQL v16, alpine = lightweight Linux
    container_name: calisthenics_db  # Friendly name for the container
    restart: unless-stopped          # Auto-restart if it crashes (not on manual stop)

    # Environment variables passed into the container
    # These configure the PostgreSQL database on first startup
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}          # DB username (defaults to 'postgres')
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}  # DB password (defaults to 'postgres')
      POSTGRES_DB: ${DB_NAME:-calisthenics_hub}    # Database name

    # Port mapping: HOST_PORT:CONTAINER_PORT
    # This lets your backend connect to localhost:5432
    ports:
      - '5432:5432'

    # Volumes persist data even when the container stops
    # Without this, your database resets every time Docker restarts
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Health check — ensures the DB is truly ready before the app connects
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # pgAdmin — Visual Database Browser (Optional but useful for beginners)
  # Access at: http://localhost:5050
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: calisthenics_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@calisthenics.dev
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - '5050:80'

    depends_on:
      postgres:
        condition: service_healthy  # Only start after postgres is healthy

# Named volumes — Docker manages these on your filesystem
volumes:
  postgres_data:
    driver: local
